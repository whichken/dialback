#!/usr/sbin/nft -f
# Dialback gateway firewall/NAT rules.
#
# eth0  = downstream to retro PC
# wlan0 = upstream internet link

flush ruleset

table inet dialback {

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        # Intercept ALL HTTP from the retro PC into the dialback router.
        # The router serves everything on port 80, incl. admin (by Host header).
        iifname "eth0" tcp dport 80 redirect to :8888
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
        ct state established,related accept
        iifname "eth0" oifname "wlan0" accept
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "wlan0" masquerade
    }
}
