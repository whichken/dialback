# Dialback gateway: DHCP + DNS for the retro PC on eth0.
#
# Stage 1 behavior: DNS forwards upstream so the retro PC reaches the REAL
# internet through the Pi. Stage 2 replaces forwarding with wildcard answers
# pointing at the dialback router service.

interface=eth0
bind-dynamic

listen-address=10.0.0.1

# DHCP for the retro machine
dhcp-range=10.0.0.100,10.0.0.150,255.255.255.0,12h
dhcp-option=option:router,10.0.0.1
dhcp-option=option:dns-server,10.0.0.1

# Control-plane name, always points here regardless of era (stage 6 UI)
address=/admin.dialback/10.0.0.1

# Stage-2 demo: any *.dialback.test name resolves to a dummy IP; the redirect
# catches it and the placeholder provider answers (matches the router rule)
address=/dialback.test/10.0.0.2

# Upstream DNS: follow whatever resolver wlan0's DHCP provided
# (/etc/resolv.conf is regenerated by NetworkManager; dnsmasq watches it)

# Uncomment while debugging:
#log-queries
#log-dhcp
