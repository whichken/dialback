# Dialback gateway: DHCP + DNS for the retro PC on eth0.
#
# Stage 3 behavior: wildcard DNS points EVERY hostname at the gateway.
# The dialback router decides what each host serves (archived snapshot,
# synthesized site, passthrough, ...). Non-HTTP traffic still NATs through.

interface=eth0
bind-dynamic

listen-address=10.0.0.1

# DHCP for the retro machine
dhcp-range=10.0.0.100,10.0.0.150,255.255.255.0,12h
dhcp-option=option:router,10.0.0.1
dhcp-option=option:dns-server,10.0.0.1

# Control-plane name, always points here regardless of era (stage 6 UI)
address=/admin.dialback/10.0.0.1

# Wildcard: every name belongs to the gateway in the current era.
address=/#/10.0.0.1

# Reverse records so client diagnostics (nslookup of 10.0.0.x) look sane
ptr-record=1.0.0.10.in-addr.arpa,dialback
ptr-record=2.0.0.10.in-addr.arpa,dialback.test

# Upstream DNS: follow whatever resolver wlan0's DHCP provided
# (/etc/resolv.conf is regenerated by NetworkManager; dnsmasq watches it)

# Uncomment while debugging:
#log-queries
#log-dhcp
