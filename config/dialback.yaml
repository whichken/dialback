# Dialback router main configuration.
# Deployed to /etc/dialback/dialback.yaml

listen_host: 0.0.0.0
listen_port: 8888

# Control plane UI (stage 6): reachable as admin.dialback from the retro PC,
# and from your modern LAN at http://<pi-ip>:8899
admin:
  hostname: admin.dialback
  listen_port: 8899

# Active era: name of a YAML profile in era_dir
era: "1997"
era_dir: /opt/dialback/eras

# Stage 3: the archive is now the default experience - unknown hosts get
# their era-appropriate archived pages (or a "not in the archive" page).
default_provider: archive

providers:
  archive:
    cache_root: /var/cache/dialback
    # eviction: whichever cap is hit first
    cache_max_pct: 85        # % of backing filesystem (SD card)
    # cache_max_mb: 20000    # optional absolute cap in MB
    # when a host has no archived snapshot, invent it instead:
    fallback_provider: llm
  llm:
    model: gpt-5.6-luna
    # api_base: https://openrouter.ai/api/v1   (default)
    max_tokens: 4000
    daily_request_cap: 300      # 0 = unlimited; counter resets daily/restart
    cache_root: /var/cache/dialback
  search:
    model: gpt-5.6-luna
    cache_root: /var/cache/dialback
  hybrid:
    # inherits archive's settings via subclassing; keep cache aligned
    cache_root: /var/cache/dialback
    fallback_provider: llm

rules:
  # Era search engines (stage 7) - real queries, synthesized-but-real links
  - match:
      host: "*.altavista.digital.com"
    provider: search
  - match:
      host: "altavista.digital.com"
    provider: search
  - match:
      host: "*.altavista.com"
    provider: search
  - match:
      host: "altavista.com"
    provider: search
  - match:
      host: "*.hotbot.com"
    provider: search
  - match:
      host: "hotbot.com"
    provider: search
  - match:
      host: "*.lycos.com"
    provider: search
  - match:
      host: "lycos.com"
    provider: search
  - match:
      host: "search.yahoo.com"
    provider: search

  # Hybrid: archived content dressed with era chrome
  - match:
      host: "*.geocities.com"
    provider: hybrid
  - match:
      host: "*.angelfire.com"
    provider: hybrid
  - match:
      host: "*.tripod.com"
    provider: hybrid

  # Test hooks: *.dialback.test shows the placeholder page (proves routing)
  - match:
      host: "*.dialback.test"
    provider: placeholder
  - match:
      host: "dialback.test"
    provider: placeholder

  # Escape hatch: hosts you always want served live from today's internet
  - match:
      host: "*.windowsupdate.com"
    provider: passthrough
